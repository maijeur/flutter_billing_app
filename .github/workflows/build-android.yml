name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Épicerie Tunisie APK
    runs-on: ubuntu-latest
    steps:
      - name: Get source code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install web app dependencies
        run: npm install

      - name: Install Capacitor 7
        run: npm install --no-save @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7 @capacitor-mlkit/barcode-scanning@7.2.1

      - name: Build web app
        run: npm run build

      - name: Configure Android app
        run: |
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "tn.epicerie.app",
            "appName": "Épicerie Tunisie",
            "webDir": "dist"
          }
          EOF
          npx cap add android
          python3 - <<'PY'
          from pathlib import Path
          manifest = Path('android/app/src/main/AndroidManifest.xml')
          xml = manifest.read_text()
          permission = '    <uses-permission android:name="android.permission.CAMERA" />\\n'
          if 'android.permission.CAMERA' not in xml:
              xml = xml.replace('<application', permission + '    <application', 1)
          metadata = '        <meta-data android:name="com.google.mlkit.vision.DEPENDENCIES" android:value="barcode_ui" />\\n'
          if 'com.google.mlkit.vision.DEPENDENCIES' not in xml:
              xml = xml.replace('<application', '<application\\n' + metadata.rstrip(), 1)
          manifest.write_text(xml)
          PY
          npx cap sync android

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: epicerie-tunisie-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
